<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>滑台状态 · 演示</title>
<style>
  :root{
    --bg:#070b14; --panel:#0d1526; --line:#1e293b;
    --text:#e2e8f0; --muted:#64748b;
    --cyan:#22d3ee; --blue:#38bdf8; --green:#34d399;
    --amber:#fbbf24; --red:#f87171;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text); overflow:hidden;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(56,189,248,.14), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(34,211,238,.10), transparent 60%),
      var(--bg);
  }
  .app{height:100vh;display:flex;flex-direction:column;padding:26px 42px 18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,#0ea5e9,#22d3ee);
    box-shadow:0 0 26px rgba(34,211,238,.45);position:relative}
  .logo::after{content:"";position:absolute;inset:11px;border:2px solid #06121f;border-radius:4px}
  h1{font-size:22px;margin:0;letter-spacing:.5px}
  .brand p{margin:3px 0 0;color:var(--muted);font-size:12px;letter-spacing:2px}
  .conn{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted);
    border:1px solid var(--line);padding:9px 16px;border-radius:999px;background:rgba(13,21,38,.7)}
  .conn i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .conn.on i{background:var(--green);box-shadow:0 0 12px var(--green)}
  .conn.off i{background:var(--red);box-shadow:0 0 12px var(--red)}

  main{flex:1;display:grid;grid-template-columns:1.65fr .85fr;gap:34px;min-height:0;margin-top:28px}
  .left{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .readout{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .pos{font-variant-numeric:tabular-nums;line-height:.9;letter-spacing:-2px}
  .pos #pos{font-size:clamp(62px,8.4vw,126px);font-weight:700;
    background:linear-gradient(180deg,#f8fafc,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .pos em{font-style:normal;font-size:clamp(18px,2vw,28px);color:var(--muted);margin-left:10px;letter-spacing:0}
  .chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;
    border:1px solid var(--line);background:rgba(13,21,38,.75);color:var(--muted);font-size:14px;white-space:nowrap}
  .chip i{width:7px;height:7px;border-radius:50%;background:#475569}
  .chip.ok{color:#bbf7d0;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.08)}
  .chip.ok i{background:var(--green);box-shadow:0 0 9px var(--green)}
  .chip.on{color:#bae6fd;border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.1)}
  .chip.on i{background:var(--blue);box-shadow:0 0 9px var(--blue)}
  .chip.warn{color:#fde68a;border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
  .chip.warn i{background:var(--amber);box-shadow:0 0 9px var(--amber)}
  .chip.hot{color:#fecaca;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
  .chip.hot i{background:var(--red);box-shadow:0 0 9px var(--red)}

  .err{display:none;margin-top:18px;padding:12px 16px;border-radius:12px;font-size:15px;
    color:#fecaca;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.35)}
  .err.show{display:block}

  .track-wrap{margin-top:34px;padding:10px 34px 0}
  .track{position:relative;height:170px}
  .rail{position:absolute;left:0;right:0;top:78px;height:8px;border-radius:99px;background:#111c30;
    border:1px solid #1e293b;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#0284c7,#22d3ee);
    box-shadow:0 0 18px rgba(34,211,238,.55);transition:width .12s linear}
  .ticks{position:absolute;left:0;right:0;top:90px;height:14px}
  .tick{position:absolute;top:0;width:1px;height:7px;background:#334155;transform:translateX(-50%)}
  .tick.major{height:13px;background:#475569}
  .tick span{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    font-size:12px;color:#5b6b82;white-space:nowrap;font-variant-numeric:tabular-nums}
  .sensor{position:absolute;left:-6px;top:72px;width:14px;height:20px;border-radius:4px;
    background:linear-gradient(180deg,#f87171,#991b1b);box-shadow:0 0 16px rgba(248,113,113,.55)}
  .sensor span{position:absolute;top:24px;left:50%;transform:translateX(-50%);font-size:11px;color:#fca5a5;white-space:nowrap}
  .carriage{position:absolute;left:0;top:48px;width:64px;height:64px;transform:translateX(-50%);
    transition:left .12s linear;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
  .cbody{position:absolute;inset:0;border-radius:14px;
    background:linear-gradient(150deg,#e2e8f0,#94a3b8 55%,#64748b);
    border:1px solid rgba(255,255,255,.55)}
  .cbody::before{content:"";position:absolute;left:12px;right:12px;top:13px;height:5px;border-radius:99px;
    background:linear-gradient(90deg,#0ea5e9,#22d3ee);opacity:.9}
  .cbody::after{content:"";position:absolute;left:50%;top:26px;width:20px;height:20px;transform:translateX(-50%);
    border-radius:6px;border:2px solid #475569;background:#cbd5e1}
  .carriage.moving .cbody{box-shadow:0 0 0 2px rgba(34,211,238,.25),0 0 32px rgba(34,211,238,.5)}
  .carriage.moving{animation:breathe 1.1s ease-in-out infinite}
  @keyframes breathe{50%{filter:drop-shadow(0 10px 26px rgba(34,211,238,.55))}}

  aside{background:linear-gradient(180deg,rgba(15,23,42,.9),rgba(9,14,26,.9));border:1px solid var(--line);
    border-radius:18px;padding:20px 20px 14px;display:flex;flex-direction:column;min-height:0}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .panel-head h2{font-size:15px;margin:0;letter-spacing:1px;color:#cbd5e1;font-weight:600}
  .panel-head span{font-size:12px;color:var(--muted)}
  #log{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
  #log li{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid rgba(30,41,59,.6);font-size:13.5px;color:#cbd5e1}
  #log li time{color:#5b6b82;font-variant-numeric:tabular-nums;flex:0 0 auto}
  #log li.ok span{color:#a7f3d0}
  #log li.warn span{color:#fde68a}
  #log li.err span{color:#fecaca}

  footer{display:flex;justify-content:space-between;gap:20px;color:#475569;font-size:12px;
    border-top:1px solid rgba(30,41,59,.7);padding-top:12px;margin-top:14px}
  footer b{color:#64748b;font-weight:500}
  @media(max-width:980px){
    main{grid-template-columns:1fr}
    aside{display:none}
    .app{padding:20px}
    .pos #pos{font-size:64px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo"></div>
      <div>
        <h1>滑台状态</h1>
        <p>SLIDE STAGE · HID TELEMETRY</p>
      </div>
    </div>
    <div class="conn" id="connBox"><i></i><span id="connText">连接中…</span></div>
  </header>

  <main>
    <section class="left">
      <div class="readout">
        <div class="pos"><span id="pos">--</span><em>mm</em></div>
        <div class="chips">
          <span class="chip" id="chipHomed"><i></i>未回零</span>
          <span class="chip" id="chipMove"><i></i>停止</span>
          <span class="chip" id="chipKey"><i></i>复位键 松开</span>
          <span class="chip" id="chipZero"><i></i>离开 0 点</span>
        </div>
      </div>

      <div class="err" id="errBox"><b>错误</b> <span id="errText"></span></div>

      <div class="track-wrap">
        <div class="track">
          <div class="rail"><div class="fill" id="fill"></div></div>
          <div class="ticks" id="ticks"></div>
          <div class="sensor"><span>复位</span></div>
          <div class="carriage" id="carriage"><div class="cbody"></div></div>
        </div>
      </div>
    </section>

    <aside>
      <div class="panel-head"><h2>状态记录</h2><span>最近 12 条</span></div>
      <ul id="log"></ul>
    </aside>
  </main>

  <footer>
    <span><b>设备</b> HID 0483:572B</span>
    <span><b>刷新</b> 100 ms</span>
    <span id="clock"></span>
  </footer>
</div>

<script>
const MAX_MM = 300;
const ERR_TEXT = {1:"未回零，请先执行 reset",2:"超程或指令非法",3:"回零失败，请检查复位开关"};
const $ = id => document.getElementById(id);

function buildTicks(){
  const ticks = $("ticks");
  for (let mm = 0; mm <= MAX_MM; mm += 25){
    const t = document.createElement("div");
    t.className = "tick" + (mm % 50 === 0 ? " major" : "");
    t.style.left = (mm / MAX_MM * 100) + "%";
    if (mm % 50 === 0){
      const s = document.createElement("span");
      s.textContent = mm;
      t.appendChild(s);
    }
    ticks.appendChild(t);
  }
}

function setChip(id, text, cls){
  const el = $(id);
  el.className = "chip" + (cls ? " " + cls : "");
  el.innerHTML = "<i></i>" + text;
}

function addLog(text, cls){
  const li = document.createElement("li");
  if (cls) li.className = cls;
  const now = new Date().toLocaleTimeString("zh-CN", {hour12:false});
  li.innerHTML = `<time>${now}</time><span>${text}</span>`;
  const log = $("log");
  log.prepend(li);
  while (log.children.length > 12) log.lastChild.remove();
}

let prev = null;

function render(s){
  const connected = !!s.connected;
  const pos = Number(s.pos_mm) || 0;
  const pct = Math.max(0, Math.min(100, pos / MAX_MM * 100));

  $("connBox").className = "conn " + (connected ? "on" : "off");
  $("connText").textContent = connected ? "已连接" : "未连接数据服务";
  $("pos").textContent = connected ? pos.toFixed(3) : "--";
  $("fill").style.width = pct + "%";
  $("carriage").style.left = pct + "%";
  $("carriage").classList.toggle("moving", connected && !!s.moving);

  setChip("chipHomed", s.homed ? "已回零" : "未回零", s.homed ? "ok" : "warn");
  setChip("chipMove", s.moving ? (s.homed ? "移动中" : "回零中") : "停止", s.moving ? "on" : "");
  setChip("chipKey", s.key ? "复位键 按下" : "复位键 松开", s.key ? "hot" : "");
  setChip("chipZero", s.zero ? "位于 0 点" : "离开 0 点", s.zero ? "ok" : "");

  const err = Number(s.error) || 0;
  if (connected && err){
    $("errBox").classList.add("show");
    $("errText").textContent = (ERR_TEXT[err] || "未知错误") + "（err=" + err + "）";
  } else {
    $("errBox").classList.remove("show");
  }

  if (!prev){
    if (connected) addLog("设备已连接", "ok");
  } else {
    if (prev.connected !== connected) addLog(connected ? "设备已连接" : "设备断开", connected ? "ok" : "err");
    if (connected && prev.homed !== s.homed) addLog(s.homed ? "回零完成，0 点已建立" : "回零状态丢失", s.homed ? "ok" : "warn");
    if (connected && prev.moving !== s.moving && s.moving) addLog(s.homed ? "开始移动" : "开始回零", "");
    if (connected && prev.moving !== s.moving && !s.moving) addLog("运动停止", "");
    if (connected && err && prev.error !== err) addLog("错误：" + (ERR_TEXT[err] || "未知"), "err");
  }

  prev = {connected, homed:!!s.homed, moving:!!s.moving, error:err};
}

function disconnected(){
  $("connBox").className = "conn off";
  $("connText").textContent = "未连接数据服务";
  $("pos").textContent = "--";
  $("carriage").classList.remove("moving");
  if (!prev || prev.connected){
    addLog("未连接到 hid_demo_server.py", "err");
  }
  prev = {connected:false, homed:false, moving:false, error:0};
}

async function poll(){
  try{
    const res = await fetch("/api/state", {cache:"no-store"});
    if (!res.ok) throw new Error("bad status");
    render(await res.json());
  }catch(e){
    disconnected();
  }
  setTimeout(poll, 100);
}

setInterval(() => {
  $("clock").textContent = "本地时间 " + new Date().toLocaleTimeString("zh-CN", {hour12:false});
}, 1000);

buildTicks();
poll();
</script>
</body>
</html>
